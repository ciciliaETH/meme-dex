<style>
/* Layout: app shell with a left nav rail (bottom tab bar on phones), top search bar, trending tape,
   then the market table or the token desk (summary bar, chart + trades | grade, origin, stats, security). */
:root {
  --bg: #07050a;
  --panel: #0e0a12;
  --panel-2: #140f19;
  --panel-3: #1c1522;
  --line: rgba(255, 255, 255, .07);
  --line-2: rgba(255, 255, 255, .12);
  --fg: #f5eff7;
  --muted: #9d91a6;
  --dim: #62576b;
  --accent: #ff3d9a;
  --accent-2: #c48fd6;
  --accent-soft: rgba(255, 61, 154, .14);
  --up: #38cfff;
  --down: #ff4f8f;
  --up-soft: rgba(56, 207, 255, .14);
  --down-soft: rgba(255, 79, 143, .14);
  --warn: #ffb547;
  --warn-soft: rgba(255, 181, 71, .13);
  --g-a: #3ee6c5; --g-b: #59c8ff; --g-c: #b9a4ff; --g-d: #ffb547; --g-e: #ff8a6b; --g-f: #ff3d7f;
  --grid: rgba(255, 255, 255, .035);
  --glow-1: rgba(255, 46, 147, .30);
  --glow-2: rgba(160, 30, 120, .26);
  --btn-hi: #ff7cc0; --btn-mid: #ff2e8a; --btn-lo: #d0157a;
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
  --r-sm: 10px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f7f2f7; --panel: #ffffff; --panel-2: #faf6fa; --panel-3: #f1e9f2;
  --line: rgba(40, 10, 40, .08); --line-2: rgba(40, 10, 40, .14);
  --fg: #1a1220; --muted: #6d6175; --dim: #a397aa;
  --accent: #e0207f; --accent-2: #9a5bb0; --accent-soft: rgba(224, 32, 127, .1);
  --up: #0a8fc2; --down: #d61f64; --up-soft: rgba(10, 143, 194, .1); --down-soft: rgba(214, 31, 100, .1);
  --warn: #a86400; --warn-soft: rgba(168, 100, 0, .1);
  --g-a: #0a9c86; --g-b: #0a83c2; --g-c: #6b4fd6; --g-d: #b06a00; --g-e: #d4502c; --g-f: #d61f64;
  --grid: rgba(0, 0, 0, .05); --glow-1: rgba(255, 61, 154, .16); --glow-2: rgba(196, 143, 214, .18);
  color-scheme: light;
}

* { box-sizing: border-box; }
/* square everything: no rounded corners on any element */
*, *::before, *::after { border-radius: 0 !important; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background:
    radial-gradient(700px 520px at 100% -10%, var(--glow-1), transparent 65%),
    radial-gradient(620px 520px at -8% 105%, var(--glow-2), transparent 65%),
    var(--bg);
  background-attachment: fixed;
  color: var(--fg);
  font: 500 13.5px/1.45 var(--font-body);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num, .mono { font-variant-numeric: tabular-nums; }
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--muted); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px;
  padding: max(22px, env(safe-area-inset-top, 0px)) 16px 20px max(16px, env(safe-area-inset-left, 0px));
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 70%, transparent), color-mix(in srgb, var(--panel) 40%, transparent));
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; padding: 0 6px; }
.brand .mark { width: 34px; height: 34px; flex: none; filter: drop-shadow(0 4px 14px rgba(255, 46, 138, .45)); }
.overview { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 14px; }
.overview:empty { display: none; }
.ov { background: color-mix(in srgb, var(--panel) 94%, transparent); padding: 12px 14px; display: grid; gap: 7px; min-width: 0; align-content: start; }
.ov > span { color: var(--dim); font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
.ov > b { font: 700 19px/1.1 var(--font-display); }
.ov-tok { display: flex; align-items: center; gap: 7px; text-decoration: none; min-width: 0; font-weight: 700; font-size: 14px; }
.ov-tok b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ov-tok span { margin-left: auto; font-weight: 800; flex: none; }
.ov-tok:hover b { color: var(--accent); }
@media (max-width: 1100px) { .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ov.opt { display: none; } }
.tok-cell { display: flex; align-items: center; gap: 4px; }
.star { flex: none; width: 26px; height: 26px; border: 0; background: none; color: var(--dim); cursor: pointer; font-size: 15px; line-height: 1; display: grid; place-items: center; padding: 0; }
.star:hover { color: var(--fg); }
.star[aria-pressed="true"] { color: var(--warn); text-shadow: 0 0 10px var(--warn); }
.d-id .star { width: 34px; height: 34px; font-size: 19px; border: 1px solid var(--line-2); background: var(--panel-2); }
@media (max-width: 720px) { .market .star { display: none; } }
.brand b { font: 700 19px/1 var(--font-display); letter-spacing: -.01em; }
.brand b span { color: var(--accent); }
.nav { display: grid; gap: 4px; }
.nav .tab { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: var(--r-sm); text-decoration: none; color: var(--muted); font-weight: 600; border: 1px solid transparent; }
.nav .tab svg { width: 18px; height: 18px; flex: none; }
.nav .tab:hover { color: var(--fg); background: var(--panel-2); }
.nav .tab .cnt { margin-left: auto; font-size: 11.5px; color: var(--dim); }
.tab[aria-current="page"], .glossy {
  color: #fff;
  background: linear-gradient(180deg, var(--btn-hi) 0%, var(--btn-mid) 55%, var(--btn-lo) 100%);
  border-color: rgba(255, 150, 200, .55);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 8px 26px rgba(255, 46, 138, .38);
}
.nav .tab[aria-current="page"] .cnt { color: rgba(255, 255, 255, .8); }
.side-foot { margin-top: auto; color: var(--dim); font-size: 11.5px; padding: 0 6px; display: grid; gap: 6px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.shell { width: 100%; max-width: 1400px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px); background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top .shell { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.top .brand { display: none; }
.search { position: relative; flex: 1 1 auto; min-width: 0; max-width: 520px; }
.search input {
  width: 100%; height: 42px; padding: 0 42px 0 40px; border-radius: 12px;
  border: 1px solid var(--line-2); background: color-mix(in srgb, var(--panel) 80%, transparent); outline: none; font-weight: 500;
}
.search input::placeholder { color: var(--dim); }
.search input:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 0 0 4px var(--accent-soft); }
.search .ico { position: absolute; left: 14px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.kbd { position: absolute; right: 12px; top: 50%; translate: 0 -50%; font-size: 11px; color: var(--muted); border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 7px; pointer-events: none; }
.search input:focus ~ .kbd { display: none; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.icon-btn { flex: none; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line-2); background: color-mix(in srgb, var(--panel) 80%, transparent); cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { color: var(--fg); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn .fx-ico { font: 18px/1 "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; transition: opacity .2s, filter .2s; }
.icon-btn[aria-pressed="false"] .fx-ico { filter: grayscale(1); opacity: .45; }
/* animal emoji layer: never catches clicks, sits above everything */
#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 9999; contain: strict; }
html.fx-on :is(a, img) { -webkit-touch-callout: none; }
.fx-e { position: absolute; left: 0; top: 0; font: 28px/1 "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; user-select: none; will-change: transform, opacity; }
.results {
  position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 30;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .5); max-height: min(70vh, 520px); overflow: auto; padding: 6px;
}
.res { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 10px; border-radius: 10px; text-decoration: none; }
.res[aria-selected="true"], .res:hover { background: var(--panel-3); }
.res .t { min-width: 0; }
.res .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.res .t span { color: var(--muted); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .v { text-align: right; font-size: 12.5px; font-weight: 600; }
.res-empty { padding: 16px; color: var(--muted); }

/* trending tape */
.tape-band { display: flex; align-items: stretch; margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--panel) 75%, transparent); height: 40px; overflow: hidden; }
.tape-label { flex: none; display: flex; align-items: center; gap: 7px; padding: 0 14px; font: 700 11px var(--font-display); letter-spacing: .1em; color: var(--accent); border-right: 1px solid var(--line); }
.ticker { overflow: hidden; flex: 1; min-width: 0; mask-image: linear-gradient(90deg, transparent, #000 28px, #000 calc(100% - 28px), transparent); }
.ticker-track { display: flex; width: max-content; height: 100%; }
.ticker-track.run { animation: marquee var(--dur, 60s) linear infinite; }
.ticker:hover .ticker-track, .ticker:focus-within .ticker-track, .tape-band.paused .ticker-track { animation-play-state: paused; }
@keyframes marquee { to { transform: translateX(-50%); } }
.tk-run { display: flex; align-items: center; gap: 24px; padding: 0 12px; }
.tk { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; white-space: nowrap; font-size: 12.5px; }
.tk:hover .tk-sym { color: var(--accent); }
.tk-rank { color: var(--dim); font-size: 11px; font-weight: 700; }
.tk-sym { font-weight: 700; }
.tk-price, .tk-chg { font-weight: 600; font-size: 12px; }
.tk-empty { padding: 0 16px; color: var(--muted); font-size: 12.5px; display: flex; align-items: center; }
.tk-pause { flex: none; border: 0; border-left: 1px solid var(--line); background: none; color: var(--muted); padding: 0 14px; cursor: pointer; font: 700 10.5px var(--font-display); letter-spacing: .08em; text-transform: uppercase; }
.tk-pause:hover { color: var(--fg); }
@media (prefers-reduced-motion: reduce) {
  .ticker { overflow-x: auto; mask-image: none; }
  .ticker-track.run { animation: none; }
  .tk-run[aria-hidden="true"], .tk-pause { display: none; }
}

/* notices */
.notices { display: grid; gap: 8px; margin-top: 14px; }
.notices:empty { display: none; }
.notice { padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line-2); border-left: 3px solid var(--warn); font-size: 13px; }

/* ---------- list ---------- */
main { padding-block: 16px 48px; }
.toolbar { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; margin-bottom: 14px; }
.page-title { font: 700 22px/1.1 var(--font-display); margin: 0 8px 0 0; letter-spacing: -.01em; }
.pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.pills::-webkit-scrollbar { display: none; }
.pill { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line-2); background: color-mix(in srgb, var(--panel) 80%, transparent); color: var(--muted); cursor: pointer; font-weight: 700; font-size: 12px; }
.pill:hover { color: var(--fg); }
.pill[aria-pressed="true"] { color: var(--fg); border-color: color-mix(in srgb, var(--accent) 60%, transparent); background: var(--accent-soft); box-shadow: 0 0 18px var(--accent-soft); }
.pill .cicon { width: 16px; height: 16px; }
.pill .all-ico { width: 14px; height: 14px; flex: none; color: currentColor; }
.pill:not([aria-pressed="true"]) .cicon { opacity: .85; }
.pill:hover .cicon { opacity: 1; }
/* chain logos (pills, token badge, inline): image with a plain square fallback */
.cicon { display: block; flex: none; width: 16px; height: 16px; object-fit: contain; }
i.cicon { background: var(--c, var(--dim)); }
.cicon.in { display: inline-block; width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px; }
.live { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 10px var(--up); animation: pulse 1.8s infinite; flex: none; }
.dot.off { background: var(--dim); box-shadow: none; animation: none; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
@media (max-width: 860px) { .live { margin-left: 0; width: 100%; } }
.src-note { color: var(--dim); font-size: 12px; margin: 12px 4px 0; }

.panel { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 20px 50px rgba(0, 0, 0, .25); }
.grid-card { overflow: hidden; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
.market th, .market td { padding: 10px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
.market th { position: sticky; top: 0; background: var(--panel); font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--dim); z-index: 3; padding-block: 12px; }
.market th button { all: unset; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
.market th button:hover { color: var(--fg); }
.market th button:focus-visible { outline: 2px solid var(--accent); }
.market th[aria-sort] { color: var(--accent); }
.market th .arr { font-size: 8px; opacity: .5; }
.market th[aria-sort] .arr { opacity: 1; }
.market td { background: var(--panel); font-weight: 600; font-size: 13px; }
.market tbody tr { cursor: pointer; }
.market tbody tr:hover td { background: var(--panel-2); }
.market tbody tr:last-child td { border-bottom: 0; }
.market .c-token { position: sticky; left: 0; z-index: 2; text-align: left; }
.market th.c-token { z-index: 4; }
.c-rank { width: 34px; color: var(--dim); font-size: 12px !important; text-align: left !important; }
.c-grade { text-align: center !important; width: 64px; }
.c-spark { width: 110px; }
.tok { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; width: 250px; }
.tok-txt { display: grid; gap: 4px; min-width: 0; }
.tok-l1 { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.tok-sym { font-weight: 800; font-size: 14px; }
.tok-name { color: var(--muted); font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.two { display: grid; gap: 2px; justify-items: end; }
.two small { font-size: 11px; color: var(--dim); font-weight: 600; }
.sub { display: none !important; }
.spark { display: block; margin-left: auto; overflow: visible; }
.spark path { filter: drop-shadow(0 0 4px currentColor); stroke-linejoin: miter; }
.spark.flat-sp { color: var(--muted); }
.fl-up .pv { animation: flup .9s ease-out; }
.fl-down .pv { animation: fldown .9s ease-out; }
@keyframes flup { 0%, 30% { color: var(--up); text-shadow: 0 0 12px var(--up); } 100% { color: inherit; text-shadow: none; } }
@keyframes fldown { 0%, 30% { color: var(--down); text-shadow: 0 0 12px var(--down); } 100% { color: inherit; text-shadow: none; } }
@media (prefers-reduced-motion: reduce) { .fl-up .pv, .fl-down .pv { animation: none; } }
@media (max-width: 1799px) { .hide-xl { display: none; } }
@media (max-width: 1399px) { .hide-l { display: none; } }
@media (max-width: 1099px) { .hide-t { display: none; } }

/* risk tags */
.chips-line { display: flex; gap: 4px; flex-wrap: nowrap; overflow: hidden; min-height: 18px; mask-image: linear-gradient(90deg, #000 82%, transparent); }
.ch { flex: none; font-size: 10.5px; font-weight: 700; line-height: 1; padding: 4px 7px; border-radius: 999px; color: var(--muted); background: var(--panel-3); white-space: nowrap; }
.ch.good { color: var(--up); background: var(--up-soft); }
.ch.warn { color: var(--warn); background: var(--warn-soft); }
.ch.bad { color: var(--down); background: var(--down-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--down) 40%, transparent); }
.ch.wait { color: var(--dim); }

/* logos */
.logo-wrap { position: relative; flex: none; width: 38px; height: 38px; }
.logo { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex: none; background: var(--panel-3); display: block; }
.logo.xs { width: 18px; height: 18px; }
.logo.lg { width: 48px; height: 48px; }
.logo-fb { display: inline-grid; place-items: center; color: #fff; font: 700 12px var(--font-display); background: linear-gradient(135deg, hsl(var(--h, 320) 75% 58%), hsl(calc(var(--h, 320) + 50) 70% 36%)); }
.logo-fb.xs { font-size: 7px; }
.logo-fb.lg { font-size: 17px; }
.cbadge { position: absolute; right: -4px; bottom: -4px; width: 17px; height: 17px; background: var(--panel); box-shadow: 0 0 0 2px var(--panel); }
.logo-wrap.lg { width: 48px; height: 48px; }
.logo-wrap.lg .cbadge { width: 20px; height: 20px; }

/* grade badges */
/* square tile: letter on top, a six-step ladder underneath (A lights all six, F lights one) */
.grade { --gc: var(--dim); position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 34px; height: 34px; vertical-align: middle;
  color: color-mix(in srgb, var(--gc) 80%, #fff);
  background: linear-gradient(180deg, color-mix(in srgb, var(--gc) 22%, var(--panel)), color-mix(in srgb, var(--gc) 5%, var(--panel)));
  border: 1px solid color-mix(in srgb, var(--gc) 40%, transparent);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 8px 18px -10px color-mix(in srgb, var(--gc) 75%, transparent); }

.g-a { --gc: var(--g-a); } .g-b { --gc: var(--g-b); } .g-c { --gc: var(--g-c); }

.btn.glossy { border: 1px solid rgba(255, 150, 200, .55); }

/* ---------- token desk ---------- */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; margin-bottom: 14px; font-weight: 700; font-size: 12.5px; }

.d-head { display: flex; align-items: center; gap: 14px 0; flex-wrap: wrap; padding: 14px 18px; margin-bottom: 12px; }

@media (max-width: 720px) {

.trades th { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--dim); position: sticky; top: 0; background: var(--panel); z-index: 1; border-top: 0; }

/* ---------- network: rate-limited queues + cache ---------- */
function limiter(gapMs, concurrency = 1) {
  const q = []; let active = 0, pausedUntil = 0;
  async function pump() {
    if (active >= concurrency) return; active++;
    while (q.length) {
      const wait = pausedUntil - Date.now(); if (wait > 0) await sleep(wait);
      const job = q.shift(); if (!job) break;
      try { job.resolve(await job.fn()); } catch (e) { job.reject(e); }
      await sleep(gapMs);
    }
    active--;
  }
  const run = (fn, priority) => new Promise((resolve, reject) => {
    const job = { fn, resolve, reject };
    priority ? q.unshift(job) : q.push(job);
    pump();
  });
  run.pause = ms => { pausedUntil = Math.max(pausedUntil, Date.now() + ms); };
  return run;
}
const L = { gt: limiter(2500), ds: limiter(200), dsSearch: limiter(350), goplus: limiter(1500), rug: limiter(1500), bs: limiter(150, 3) };

async function fetchJSON(url, timeout = 15000) {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(url, { signal: ctrl.signal, headers: { accept: "application/json" } });
    if (!res.ok) { const e = new Error("HTTP " + res.status); e.status = res.status; throw e; }
    return await res.json();
  } finally { clearTimeout(t); }
}
function getJSON(url, lim, label, priority) {
  return lim(async () => {
    try {
      const v = await fetchJSON(url); clearNotice(label); state.netBlocked = false; return v;
    } catch (e) {
      if (e.status === 429) { lim.pause(30000); notify(label, "rate"); throw e; }
      if (!e.status && CFG.proxy) {

      }
      if (!e.status) { notify(label, "blocked"); state.netBlocked = true; }
      throw e;
    }
  }, priority);
}
const cache = new Map();
function cached(key, ttl, fn) {
  const now = Date.now(), hit = cache.get(key);
  if (hit && hit.pending) return hit.pending;
  if (hit && "v" in hit && now - hit.t < ttl) return Promise.resolve(hit.v);
  const pending = fn().then(
    v => { cache.set(key, { t: Date.now(), v }); return v; },
    e => { if (hit && "v" in hit) cache.set(key, { t: hit.t, v: hit.v }); else cache.delete(key); throw e; });
  cache.set(key, { ...(hit || {}), pending });
  return pending;
}

const rows = new Map();
function upsert(r) {
  if (!r) return null;
  const cur = rows.get(r.key);
  if (!cur) { rows.set(r.key, r); return r.key; }
  for (const [f, v] of Object.entries(r)) {
    if (v == null || v === "") continue;
    if (f === "change" || f === "volume" || f === "base" || f === "quote" || f === "txns") {

  ]);

  if (hit && hit.status === "err" && Date.now() - hit.t < 60000) return Promise.resolve(hit);

   ========================================================= */
const orig = new Map(), origWait = new Map();
function judgeOriginal(row, pairs) {
  const sym = (row.base.symbol || "").toLowerCase(), me = normAddr(row.base.address);
  const groups = new Map();
  for (const p of pairs || []) {
    if (p?.chainId !== row.chain || (p.baseToken?.symbol || "").toLowerCase() !== sym) continue;
    const a = normAddr(p.baseToken.address);
    const g = groups.get(a) || { address: a, name: p.baseToken.name, symbol: p.baseToken.symbol, firstAt: null, liq: 0, bestLiq: -1, pair: p.pairAddress, image: null };
    const ca = num(p.pairCreatedAt);
    if (ca) g.firstAt = g.firstAt == null ? ca : Math.min(g.firstAt, ca);
    const l = num(p.liquidity?.usd) || 0;
    g.liq += l;
    if (l > g.bestLiq) { g.bestLiq = l; g.pair = p.pairAddress; }
    g.image = g.image || validImg(p.info?.imageUrl);
    groups.set(a, g);
  }
  let mine = groups.get(me);
  if (!mine) {
    mine = { address: me, name: row.base.name, symbol: row.base.symbol, firstAt: row.createdAt || null, liq: row.liquidity || 0, pair: row.pairAddress, image: row.image };
    groups.set(me, mine);
  } else if (row.createdAt && (!mine.firstAt || row.createdAt < mine.firstAt)) mine.firstAt = row.createdAt;
  mine.self = true;
  const list = [...groups.values()].sort((a, b) => (a.firstAt ?? Infinity) - (b.firstAt ?? Infinity));
  if (!mine.firstAt) return { state: "unknown", list, older: [], alive: [] };
  const older = list.filter(g => !g.self && g.firstAt != null && g.firstAt < mine.firstAt);
  const alive = older.filter(g => g.liq >= CFG.copyLiveLiquidity);
  const state = !older.length ? "original" : alive.length ? "copy" : "unclear";
  return { state, list, older, alive };
}
function getOriginal(row, priority) {
  if (!row?.base?.symbol) return Promise.resolve({ state: "unknown", list: [], older: [], alive: [] });
  const tk = tokKey(row.chain, row.base.address);
  if (orig.has(tk)) return Promise.resolve(orig.get(tk));
  if (origWait.has(tk)) return origWait.get(tk);
  const p = api.dsSearch(row.base.symbol, priority)
    .then(pairs => { const res = judgeOriginal(row, pairs); orig.set(tk, res); return res; },
          () => ({ state: "unknown", failed: true, list: [], older: [], alive: [] }))
    .then(res => { origWait.delete(tk); paintOrig(tk, res); return res; });
  origWait.set(tk, p);
  return p;
}

/* ---------- feeds ---------- */
async function dsDiscovery(chain, force) {
  const [boosts, profiles] = await Promise.all([api.dsBoostsTop(force).catch(() => null), api.dsProfiles(force).catch(() => null)]);
  if (!boosts && !profiles) throw new Error("discovery feeds failed");
  const all = [...(boosts || []), ...(profiles || [])].filter(t => t?.chainId && t?.tokenAddress && (chain === "all" || t.chainId === chain));
  if (!all.length) return [];
  const want = new Map(), icons = new Map();
  for (const t of all) {
    if (!want.has(t.chainId)) want.set(t.chainId, new Map());
    const m = want.get(t.chainId);
    if (m.size < 30) m.set(normAddr(t.tokenAddress), t.tokenAddress);
    const ic = validImg(t.icon); if (ic) icons.set(tokKey(t.chainId, t.tokenAddress), ic);
  }
  const out = [];
  await Promise.all([...want].map(async ([ch, m]) => {
    try {
      const pairs = await api.dsTokens(ch, [...m.values()]);
      const best = new Map();
      for (const p of pairs) {
        const a = normAddr(p?.baseToken?.address);
        if (!m.has(a)) continue;
        const cur = best.get(a);
        if (!cur || (num(p.liquidity?.usd) || 0) > (num(cur.liquidity?.usd) || 0)) best.set(a, p);
      }
      for (const p of best.values()) {
        const r = normDS(p); if (!r) continue;
        r.image = r.image || icons.get(tokKey(r.chain, r.base.address)) || null;
        out.push(r);
      }
    } catch { /* one chain failing shouldn't block the rest */ }
  }));
  return out;
}
let feedRun = 0;
async function loadFeeds(force) {
  const my = ++feedRun, chain = state.chain, net = chain === "all" ? null : gtNetOf(chain);
  const sameChain = state.listChain === chain;
  if (!sameChain) { lists.trending = []; lists.fresh = []; lists.all = []; state.loaded = false; renderTicker(); renderList(); }
  const settle = p => p.then(v => v, () => null);
  const [tr, fr, top, ds] = await Promise.all([
    settle(api.gtTrending(net, force)), settle(api.gtNew(net, force)),
    net ? settle(api.gtTop(net, force)) : Promise.resolve([]), settle(dsDiscovery(chain, force)),
  ]);
  if (my !== feedRun) return;
  const keysOf = arr => (arr || []).filter(r => r && (chain === "all" || r.chain === chain)).map(upsert).filter(Boolean);
  if (tr) lists.trending = keysOf(tr);
  if (fr) lists.fresh = keysOf(fr);
  const merged = new Set([...keysOf(top), ...lists.trending, ...keysOf(ds), ...lists.fresh]);
  if (merged.size || !sameChain) lists.all = [...merged];
  state.loaded = true; state.listChain = chain;
  state.failed = !lists.all.length && !tr && !fr && !ds;
  renderTicker();
  if (state.view === "list") renderList();
  liveTick();
  enrichList();
}

}

  try {
    const keys = new Set(state.view === "detail" ? [state.detailKey] : sortedRows().map(r => r.key));
    for (const k of lists.trending.slice(0, 20)) keys.add(k);
    const byChain = new Map();

      const r = rows.get(k); if (!r) continue;
      if (!byChain.has(r.chain)) byChain.set(r.chain, []);
      byChain.get(r.chain).push(r.pairAddress);
    }
    let ok = false;
    await Promise.all([...byChain].flatMap(([ch, addrs]) => chunk(addrs, 30).map(async part => {
      try { for (const p of await api.dsPairs(ch, part, state.view === "detail")) upsert(normDS(p)); ok = true; } catch { /* keep last values */ }
    })));
    if (ok) state.lastLive = Date.now();
    updateTicker();
    if (state.view === "list") renderList();
    else paintDetailLive();
  } finally { liveBusy = false; }
}
function paintLive() {
  const dot = $("#live-dot"), txt = $("#live-txt");
  if (!state.lastLive) { dot.classList.add("off"); txt.textContent = state.loaded ? "Waiting for live data…" : "Connecting…"; return; }
  const s = Math.round((Date.now() - state.lastLive) / 1000), step = CFG.liveMs / 1000;
  const label = s <= step * 2 ? "Live" : s <= step * 4 ? "Delayed" : "Disconnected";
  dot.classList.toggle("off", label !== "Live");
  txt.textContent = `${label} · updated ${s < 2 ? "just now" : s < 120 ? s + "s ago" : Math.round(s / 60) + "m ago"}`;
}

async function loadChart(row, force) {
  if (!ensureChart()) return;
  const tfKey = chartTf, tf = TF[tfKey];
  const note = $("#chart-note");

  try {
    const list = await api.gtOhlcv(row.gtNet, row.pairAddress, tf, force);
    if (state.detailKey !== row.key || chartTf !== tfKey || !candles) return;
    const seen = new Set();
    const data = list
      .map(c => ({ time: Math.floor(num(c[0])), open: num(c[1]), high: num(c[2]), low: num(c[3]), close: num(c[4]), value: num(c[5]) || 0 }))
      .filter(d => d.time && [d.open, d.high, d.low, d.close].every(Number.isFinite))
      .sort((a, b) => a.time - b.time)
      .filter(d => !seen.has(d.time) && seen.add(d.time));
    candles.setData(data.map(({ time, open, high, low, close }) => ({ time, open, high, low, close })));
    const us = cssVar("--up-soft"), ds = cssVar("--down-soft");
    vols.setData(data.map(d => ({ time: d.time, value: d.value, color: d.close >= d.open ? us : ds })));
    const l = data[data.length - 1];
    lastCandle = l ? { time: l.time, open: l.open, high: l.high, low: l.low, close: l.close, vol: l.value } : null;
    if (!force) chart.timeScale().fitContent();
    note.textContent = data.length ? `${tfKey} candles · the last candle follows the live price` : "No candle data for this pool yet.";
  } catch (e) {

}
function tickCandle(price, usd) {

  const step = TF[chartTf].sec, now = Math.floor(Date.now() / 1000), bucket = now - (now % step);
  const add = Number.isFinite(usd) ? usd : 0;
  if (bucket > lastCandle.time) lastCandle = { time: bucket, open: lastCandle.close, high: Math.max(lastCandle.close, price), low: Math.min(lastCandle.close, price), close: price, vol: add };
  else lastCandle = { ...lastCandle, high: Math.max(lastCandle.high, price), low: Math.min(lastCandle.low, price), close: price, vol: (lastCandle.vol || 0) + add };

  try {
    candles.update({ time, open, high, low, close });
    vols.update({ time, value: vol || 0, color: close >= open ? cssVar("--up-soft") : cssVar("--down-soft") });
  } catch { /* out-of-order update, ignore */ }
}

/* ---------- trade feed: GeckoTerminal history + on-chain live ---------- */
const book = new Map();

const tzName = (() => { try { return new Intl.DateTimeFormat("en-US", { timeZoneName: "short" }).formatToParts(new Date()).find(p => p.type === "timeZoneName")?.value || ""; } catch { return ""; } })();

const dateFmt = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hour12: false });

function resetBook(key) { book.clear(); bookKey = key; }
function addTrades(list, fresh) {
  const added = [];
  for (const t of list) {
    if (!t.id || book.has(t.id)) continue;
    book.set(t.id, t); if (fresh) added.push(t.id);
  }
  if (book.size > 300) {
    const keep = [...book.values()].sort((a, b) => b.time - a.time).slice(0, 200);

}

/* =========================================================
   ON-CHAIN LIVE: listen for swaps straight from the node (WebSocket, or HTTP polling)
   EVM: event Swap (Uniswap V2/V3, PancakeSwap V3, Aerodrome/Velodrome)
   Solana: logsSubscribe on the pool address, then read balance changes in each transaction
   ========================================================= */
const TOPIC = {
  v2: "0xd78ad95fa46c994b6551d0da85fc275fe613ce37657fb8d5e3d130840159d822",
  v3: "0xc42079f94a6350d7e6235f29174924f928cc2ac818eb64fed8004e115fbcca67",
  pcs3: "0x19b47279256b2a23a1665c810c8d55a1758940ee09377d4f8d26497a3577dc83",
  solidly: "0xb3e2773606abfd36b5bd91394b3a54d1398336c65005baf7bf7a05efeffaf75b",
  v4: "0x40e9cecb9f5f1f1c5b9c97dec2917b7ee92e57ba5563708daca94dd84ad7112f",
};
const WSOL = "So11111111111111111111111111111111111111112";
const live = { session: null, status: "off", reason: "", skipped: 0 };
L.sol = limiter(Math.max(100, Math.round(1000 / CFG.solTxPerSec)));

class Rpc {

      let ws;
      try { ws = new WebSocket(this.url); } catch (e) { reject(e); return; }
      this.ws = ws;
      const t = setTimeout(() => { reject(new Error("timeout")); try { ws.close(); } catch { /* already closed */ } }, 12000);
      ws.onopen = () => { clearTimeout(t); resolve(); };
      ws.onerror = () => { clearTimeout(t); reject(new Error("ws error")); };
      ws.onmessage = e => this.onMessage(e);
      ws.onclose = () => {
        clearTimeout(t);
        for (const p of this.pending.values()) p.reject(new Error("closed"));
        this.pending.clear();
        const cb = this.onclose; this.onclose = null; cb?.();
      };
    });
  }
  onMessage(e) {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.id != null && this.pending.has(m.id)) {
      const p = this.pending.get(m.id); this.pending.delete(m.id);
      if (m.error) p.reject(Object.assign(new Error(m.error.message || "rpc error"), { code: m.error.code })); else p.resolve(m.result);
      return;
    }
    const sub = m.params?.subscription;
    if (sub != null) this.handlers.get(String(sub))?.(m.params.result);
  }
  call(method, params) {
    return new Promise((resolve, reject) => {
      if (this.ws?.readyState !== 1) { reject(new Error("not open")); return; }
      const id = ++this.seq; this.pending.set(id, { resolve, reject });
      this.ws.send(JSON.stringify({ jsonrpc: "2.0", id, method, params }));
      setTimeout(() => { if (this.pending.delete(id)) reject(new Error("timeout")); }, 15000);
    });
  }
  async subscribe(method, params, fn) { const id = await this.call(method, params); this.handlers.set(String(id), fn); return id; }
  close() { this.onclose = null; try { this.ws?.close(); } catch { /* ignore */ } }
}
class RpcPoll {
  constructor(url, everyMs) { this.url = url; this.everyMs = everyMs; this.timer = 0; this.onclose = null; this.closed = false; this.fails = 0; this.polling = true; }
  async connect() { await this.call("eth_chainId", []); }
  async call(method, params) {
    const res = await fetch(this.url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }) });
    if (!res.ok) throw Object.assign(new Error("HTTP " + res.status), { status: res.status });
    const j = await res.json();
    if (j.error) throw Object.assign(new Error(j.error.message || "rpc error"), { code: j.error.code });
    return j.result;
  }
  async subscribe(method, params, fn) {
    const filter = params[1] || {};
    let from = parseInt(await this.call("eth_blockNumber", []), 16);
    const tick = async () => {
      if (this.closed) return;
      try {
        const head = parseInt(await this.call("eth_blockNumber", []), 16);
        if (head > from) {
          const to = Math.min(head, from + 500);
          const logs = await this.call("eth_getLogs", [{ ...filter, fromBlock: "0x" + (from + 1).toString(16), toBlock: "0x" + to.toString(16) }]);
          from = to;
          for (const l of logs || []) fn(l);
        }
        this.fails = 0;
      } catch { if (++this.fails >= 5) { this.fail(); return; } }

  }
  fail() { this.closed = true; clearTimeout(this.timer); const cb = this.onclose; this.onclose = null; cb?.(); }

}
const unsupported = msg => Object.assign(new Error(msg), { unsupported: true });

function setLive(status, reason) { live.status = status; live.reason = reason || ""; paintLiveChip(); paintTradesNote(); }
function liveChipHTML() {
  const map = {
    live: ["on", "On-chain live", live.polling ? `Connected to the node. New swaps are checked every ${Math.round(CFG.pollMs / 1000)} seconds.` : "Connected to the node. Every swap shows up as it happens."],
    connecting: ["warn", "Connecting to node…", ""],
    reconnecting: ["warn", "Reconnecting…", "Lost the node connection, retrying."],
    unsupported: ["", "Updates every 15s", live.reason],
    down: ["", "Updates every 15s", live.reason],
    off: ["", "Updates every 15s", ""],
  };
  const [cls, text, tip] = map[live.status] || map.off;
  return `<span class="livechip ${cls}" id="livechip" title="${esc(tip)}"><span class="dot${cls === "on" ? "" : " off"}"></span>${esc(text)}</span>`;
}
function paintLiveChip() { const el = $("#livechip"); if (el) el.outerHTML = liveChipHTML(); }

function startOnchain(row) {
  stopOnchain();
  const s = { key: row.key, chain: row.chain, stopped: false, rpc: null, retries: 0, timer: 0, waiting: false, queue: [], meta: null, makers: 0 };
  live.session = s; live.skipped = 0;
  connectOnchain(s);
}
function stopOnchain() {
  const s = live.session;
  if (s) { s.stopped = true; clearTimeout(s.timer); s.rpc?.close(); }
  live.session = null; live.status = "off"; live.reason = "";
}
async function connectOnchain(s) {
  s.waiting = false;
  const cfg = CFG.rpc[s.chain];
  const useWs = cfg?.ws && typeof WebSocket !== "undefined";
  if (!useWs && !(cfg?.http && s.chain !== "solana")) { setLive("unsupported", `The on-chain feed isn't available for ${chainName(s.chain)} yet.`); return; }
  setLive(s.retries ? "reconnecting" : "connecting");
  const rpc = useWs ? new Rpc(cfg.ws) : new RpcPoll(cfg.http, CFG.pollMs); s.rpc = rpc;
  live.polling = !useWs;
  rpc.onclose = () => { if (!s.stopped) retryOnchain(s); };
  try {
    await rpc.connect();
    if (s.stopped) { rpc.close(); return; }
    if (s.chain === "solana") await subscribeSolana(s); else await subscribeEvm(s);
    if (s.stopped) { rpc.close(); return; }
    s.retries = 0;
    setLive("live");
  } catch (e) {

  if (s.retries > 6) { s.waiting = false; setLive("down", "Couldn't reach the node. Data still updates every 15 seconds."); return; }
  setLive("reconnecting");
  s.timer = setTimeout(() => { if (!s.stopped) connectOnchain(s); }, Math.min(30000, 1500 * 2 ** (s.retries - 1)));
}

/* EVM */
const word = (hex, i) => (hex || "").slice(2 + i * 64, 2 + (i + 1) * 64) || "0";
const big = w => { try { return BigInt("0x" + w); } catch { return 0n; } };
const signed = w => { const v = big(w); return v >= (1n << 255n) ? v - (1n << 256n) : v; };
const absBig = v => v < 0n ? -v : v;
const scaled = (v, dec) => Number(absBig(v)) / 10 ** dec;
const addrWord = w => "0x" + String(w || "").replace(/^0x/, "").slice(-40);
async function subscribeEvm(s) {
  const row = rows.get(s.key), rpc = s.rpc;
  const decOf = async a => {
    if (/^0x0{40}$/.test(a)) return 18; // native coin
    try { const v = parseInt(await rpc.call("eth_call", [{ to: a, data: "0x313ce567" }, "latest"]), 16); return v >= 0 && v <= 36 ? v : 18; } catch { return 18; }
  };
  if (/^0x[0-9a-f]{64}$/i.test(row.pairAddress)) {
    const base = normAddr(row.base.address), quote = normAddr(row.quote?.address || "");
    if (!/^0x[0-9a-f]{40}$/.test(base) || !/^0x[0-9a-f]{40}$/.test(quote)) throw unsupported("This pool type isn't recognized, so it updates every 15 seconds.");
    if (!s.meta) {
      const [decBase, decQuote] = await Promise.all([decOf(base), decOf(quote)]);
      s.meta = { v4: true, baseIs0: BigInt(base) < BigInt(quote), decBase, decQuote };
    }
    const filter = { topics: [TOPIC.v4, row.pairAddress.toLowerCase()] };
    if (CHAINS[s.chain]?.v4pm) filter.address = CHAINS[s.chain].v4pm;
    await rpc.subscribe("eth_subscribe", ["logs", filter], log => onEvmLog(s, log));
    return;
  }
  if (!/^0x[0-9a-f]{40}$/i.test(row.pairAddress)) throw unsupported("This pool type isn't recognized, so it updates every 15 seconds.");
  if (!s.meta) {
    const call = (to, data) => rpc.call("eth_call", [{ to, data }, "latest"]);
    let t0, t1;
    try { [t0, t1] = await Promise.all([call(row.pairAddress, "0x0dfe1681"), call(row.pairAddress, "0xd21220a7")]); }
    catch (e) { if (e.code != null) throw unsupported("This pool type isn't recognized, so it updates every 15 seconds."); throw e; }
    if (!t0 || t0.length < 66 || !t1 || t1.length < 66) throw unsupported("This pool type isn't recognized, so it updates every 15 seconds.");
    const a0 = normAddr(addrWord(t0)), a1 = normAddr(addrWord(t1)), base = normAddr(row.base.address);
    if (a0 !== base && a1 !== base) throw unsupported("This pool type isn't recognized, so it updates every 15 seconds.");
    const quote = a0 === base ? a1 : a0;
    const dec = async a => { try { const v = parseInt(await call(a, "0x313ce567"), 16); return v >= 0 && v <= 36 ? v : 18; } catch { return 18; } };
    const [decBase, decQuote] = await Promise.all([dec(base), dec(quote)]);
    s.meta = { baseIs0: a0 === base, decBase, decQuote };
  }
  await rpc.subscribe("eth_subscribe", ["logs", { address: row.pairAddress, topics: [[TOPIC.v2, TOPIC.v3, TOPIC.pcs3, TOPIC.solidly]] }], log => onEvmLog(s, log));
}
function onEvmLog(s, log) {
  if (s.stopped || !log || log.removed || !s.meta) return;
  const { baseIs0, decBase, decQuote } = s.meta;
  const t0 = (log.topics?.[0] || "").toLowerCase(), d = log.data || "0x";
  let buy, baseAmt, quoteAmt;
  if (t0 === TOPIC.v2 || t0 === TOPIC.solidly) {
    const [a0in, a1in, a0out, a1out] = [0, 1, 2, 3].map(i => big(word(d, i)));
    const bIn = baseIs0 ? a0in : a1in, bOut = baseIs0 ? a0out : a1out;
    const qIn = baseIs0 ? a1in : a0in, qOut = baseIs0 ? a1out : a0out;
    buy = bOut > bIn;
    baseAmt = scaled(bOut - bIn, decBase); quoteAmt = scaled(qIn - qOut, decQuote);
  } else if (t0 === TOPIC.v4) {
    // v4 amounts are from the swapper's side: positive = the swapper received that currency
    const a0 = signed(word(d, 0)), a1 = signed(word(d, 1));
    const b = baseIs0 ? a0 : a1, q = baseIs0 ? a1 : a0;
    buy = b > 0n;
    baseAmt = scaled(b, decBase); quoteAmt = scaled(q, decQuote);
  } else if (t0 === TOPIC.v3 || t0 === TOPIC.pcs3) {
    const a0 = signed(word(d, 0)), a1 = signed(word(d, 1));
    const b = baseIs0 ? a0 : a1, q = baseIs0 ? a1 : a0;
    buy = b < 0n;
    baseAmt = scaled(b, decBase); quoteAmt = scaled(q, decQuote);
  } else return;
  if (!(baseAmt > 0)) return;
  const trade = pushLiveTrade(s, { buy, baseAmt, quoteAmt, maker: log.topics?.[2] ? addrWord(log.topics[2]) : "", tx: log.transactionHash });
  // the swap event names the router as recipient; look up who actually signed the tx
  if (trade && log.transactionHash && s.makers < 3) {
    s.makers++;
    s.rpc.call("eth_getTransactionByHash", [log.transactionHash])
      .then(tx => { if (tx?.from) { trade.maker = tx.from; if (state.detailKey === s.key) paintTrades(); } })
      .catch(() => {}).finally(() => { s.makers--; });
  }
}

/* Solana */
async function subscribeSolana(s) {
  const row = rows.get(s.key);
  s.baseMint = row.base.address; s.quoteMint = row.quote?.address || WSOL;
  await s.rpc.subscribe("logsSubscribe", [{ mentions: [row.pairAddress] }], res => {
    const v = res?.value;
    if (s.stopped || !v || v.err || !v.signature) return;
    if (s.queue.length >= 25) { s.queue.shift(); live.skipped++; paintTradesNote(); }
    s.queue.push(v.signature);
    pumpSolana(s);
  });
}
async function solRpc(method, params) {
  const res = await fetch(CFG.rpc.solana.http, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }) });
  if (res.status === 429) { const e = new Error("rate"); e.status = 429; throw e; }
  const j = await res.json();
  if (j.error) throw new Error(j.error.message || "rpc error");
  return j.result;
}
async function pumpSolana(s) {
  if (s.pumping) return;
  s.pumping = true;
  try {
    while (s.queue.length && !s.stopped) {
      const sig = s.queue.shift();
      try {
        const tx = await L.sol(() => solRpc("getTransaction", [sig, { encoding: "jsonParsed", maxSupportedTransactionVersion: 0, commitment: "confirmed" }]));
        const t = parseSolTx(tx, s);
        if (t) pushLiveTrade(s, t);
      } catch (e) { if (e.status === 429) { L.sol.pause(5000); live.skipped++; } }
    }
  } finally { s.pumping = false; }
}
function parseSolTx(tx, s) {
  const meta = tx?.meta, keys = tx?.transaction?.message?.accountKeys || [];
  if (!meta || meta.err) return null;
  const signer = typeof keys[0] === "string" ? keys[0] : keys[0]?.pubkey;
  if (!signer) return null;
  const delta = mint => {
    let d = 0;
    const amt = b => num(b?.uiTokenAmount?.uiAmountString ?? b?.uiTokenAmount?.uiAmount) || 0;
    for (const b of meta.postTokenBalances || []) if (b.mint === mint && b.owner === signer) d += amt(b);
    for (const b of meta.preTokenBalances || []) if (b.mint === mint && b.owner === signer) d -= amt(b);
    return d;
  };
  const dBase = delta(s.baseMint);
  if (Math.abs(dBase) < 1e-12) return null;
  let dQuote = s.quoteMint === WSOL
    ? delta(WSOL) + ((meta.postBalances?.[0] ?? 0) - (meta.preBalances?.[0] ?? 0) + (meta.fee || 0)) / 1e9
    : delta(s.quoteMint);
  if (Math.sign(dQuote) === Math.sign(dBase)) dQuote = 0; // quote didn't move the other way: routed swap, price unknown
  return { buy: dBase > 0, baseAmt: Math.abs(dBase), quoteAmt: Math.abs(dQuote), maker: signer, tx: tx.transaction?.signatures?.[0] || "" };
}

function pushLiveTrade(s, t) {
  const row = rows.get(s.key);
  if (!row || state.detailKey !== s.key || !t.tx) return null;
  const qUsd = row.quoteUsd;
  let priceUsd = t.quoteAmt > 0 && qUsd ? t.quoteAmt / t.baseAmt * qUsd : null;
  if (priceUsd && row.priceUsd && (priceUsd / row.priceUsd > 3 || priceUsd / row.priceUsd < 1 / 3)) priceUsd = null; // ignore outliers
  const price = priceUsd ?? row.priceUsd;
  const trade = { id: t.tx, time: Date.now(), buy: t.buy, price, usd: price != null ? t.baseAmt * price : null, amount: t.baseAmt, maker: t.maker, tx: t.tx };
  const added = addTrades([trade], true);
  if (!added.length) return null;
  if (priceUsd) { row.priceUsd = priceUsd; row.priceNative = t.quoteAmt / t.baseAmt; paintHead(row); }
  tickCandle(price, trade.usd);
  paintTrades(added);
  return trade;
}

function gradeChipHTML(r) {

let searchT = 0, searchSeq = 0, resultItems = [], activeIdx = -1;
const q = $("#q"), resultsEl = $("#results");
function closeResults() { resultsEl.hidden = true; q.setAttribute("aria-expanded", "false"); activeIdx = -1; }
function showResults(html) { resultsEl.innerHTML = html; resultsEl.hidden = false; q.setAttribute("aria-expanded", "true"); }
async function runSearch(text) {
  const my = ++searchSeq;
  showResults(`<div class="res-empty">Searching “${esc(text)}”…</div>`);
  try {
    const pairs = await api.dsSearch(text, true);
    if (my !== searchSeq) return;
    const best = new Map();
    for (const p of pairs) {
      const r = normDS(p); if (!r) continue;
      const tk = tokKey(r.chain, r.base.address);
      if (!best.has(tk) || (r.liquidity || 0) > (best.get(tk).liquidity || 0)) best.set(tk, r);
    }
    resultItems = [...best.values()].sort((a, b) => (b.liquidity || 0) - (a.liquidity || 0)).slice(0, 12).map(r => rows.get(upsert(r)));
    activeIdx = -1;
    if (!resultItems.length) { showResults(`<div class="res-empty">No tokens match “${esc(text)}”.</div>`); return; }
    showResults(resultItems.map((r, i) => `<a class="res" role="option" id="res-${i}" aria-selected="false" href="${detailHref(r)}">
      ${logoHTML(r)}<span class="t"><b>${esc(r.base.symbol)} <span style="display:inline;color:var(--muted);font-weight:400">/${esc(r.quote.symbol)}</span></b><span>${esc(r.base.name)} · ${chainIconHTML(r.chain, "in")}${esc(chainName(r.chain))} · Liquidity ${fmtUsd(r.liquidity)}</span></span>
      <span class="v num">${fmtPrice(r.priceUsd)}<br><span class="${pctCls(r.change?.h24)}">${fmtPct(r.change?.h24)}</span></span></a>`).join(""));
  } catch {
    if (my === searchSeq) showResults(`<div class="res-empty">Search failed. Check your connection and try again.</div>`);
  }
}
q.addEventListener("input", () => {
  clearTimeout(searchT);
  const text = q.value.trim();
  if (text.length < 2) { searchSeq++; closeResults(); return; }
  searchT = setTimeout(() => runSearch(text), 320);
});
q.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeResults(); return; }
  if (resultsEl.hidden || !resultItems.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    activeIdx = (activeIdx + (e.key === "ArrowDown" ? 1 : -1) + resultItems.length) % resultItems.length;
    $$(".res", resultsEl).forEach((el, i) => el.setAttribute("aria-selected", String(i === activeIdx)));
    $("#res-" + activeIdx)?.scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") {
    const r = resultItems[activeIdx >= 0 ? activeIdx : 0];
    if (r) { location.hash = detailHref(r); q.blur(); }
  }
});

/* fun mode: animal emoji cursor + bursts on click/tap + stream on press-and-hold */
(() => {
  const root = document.documentElement;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const layer = document.createElement("div"); layer.id = "fx"; layer.setAttribute("aria-hidden", "true");
  document.body.appendChild(layer);
  const style = document.createElement("style"); document.head.appendChild(style);
  const pick = () => CFG.fx.animals[Math.floor(Math.random() * CFG.fx.animals.length)];
  const rnd = (a, b) => a + Math.random() * (b - a);

  // cursor: draw the emoji on a canvas (works in every browser, unlike emoji-in-SVG cursors)
  function emojiPng(e, px) {
    const c = document.createElement("canvas"); c.width = c.height = px;
    const g = c.getContext("2d");
    g.font = `${Math.round(px * .78)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(e, px / 2, px / 2 + px * .04);
    return c.toDataURL("image/png");
  }
  function cursorRule(sel, e, fallback) {
    const a = emojiPng(e, 32), b = emojiPng(e, 64);
    return `${sel}{cursor:url(${a}) 16 16,${fallback};cursor:-webkit-image-set(url(${a}) 1x,url(${b}) 2x) 16 16,${fallback};cursor:image-set(url(${a}) 1x,url(${b}) 2x) 16 16,${fallback}}`;
  }
  let cursorCSS = "";
  function paintCursor(on) {
    if (on && !cursorCSS) {
      try {
        cursorCSS = cursorRule("html.fx-on,html.fx-on body", CFG.fx.cursor, "auto")
          + cursorRule("html.fx-on :is(a,button,[role=button],label,summary,select,.market tbody tr,.pill,.tab)", CFG.fx.cursorHover, "pointer")
          + "html.fx-on :is(input,textarea){cursor:text}";
      } catch { cursorCSS = ""; }
    }
    style.textContent = on ? cursorCSS : "";
  }

  function spawn(x, y, frames, duration) {
    if (layer.childElementCount >= CFG.fx.maxOnScreen) return;
    const el = document.createElement("span"); el.className = "fx-e"; el.textContent = pick();
    layer.appendChild(el);
    const a = el.animate(frames, { duration, easing: "cubic-bezier(.2,.7,.3,1)", fill: "forwards" });
    a.onfinish = a.oncancel = () => el.remove();
  }
  const at = (x, y, s, r) => `translate(${x}px,${y}px) translate(-50%,-50%) scale(${s}) rotate(${r}deg)`;
  // a click/tap: animals pop out in a fan, then drop and fade
  function burst(x, y) {
    for (let i = 0; i < CFG.fx.burst; i++) {
      const ang = rnd(-165, -15) * Math.PI / 180, dist = rnd(55, 125), s = rnd(.8, 1.35), r = rnd(-40, 40);
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
      spawn(x, y, [
        { transform: at(x, y, .3, 0), opacity: 1 },
        { transform: at(x + dx, y + dy, s, r), opacity: 1, offset: .5 },
        { transform: at(x + dx * 1.25, y + dy + rnd(60, 110), s * .85, r * 1.6), opacity: 0 },
      ], rnd(900, 1300));
    }
  }
  // holding down: animals keep floating up from the finger/cursor
  function rise(x, y) {
    const jx = rnd(-14, 14), drift = rnd(-40, 40), s = rnd(.7, 1.2), r = rnd(-25, 25);
    spawn(x, y, [
      { transform: at(x + jx, y, .4, 0), opacity: 0 },
      { transform: at(x + jx + drift * .3, y - 30, s, r * .4), opacity: 1, offset: .15 },
      { transform: at(x + jx + drift, y - rnd(140, 220), s * 1.15, r), opacity: 0 },
    ], rnd(1200, 1800));
  }

  let on = store.get("lt.fx", true) !== false, holdT = 0, pos = null;
  const stopHold = () => { clearInterval(holdT); holdT = 0; pos = null; };
  function setOn(v) {
    on = v; store.set("lt.fx", v);
    root.classList.toggle("fx-on", v);
    $("#fx-toggle").setAttribute("aria-pressed", String(v));
    paintCursor(v);
    if (!v) { stopHold(); layer.replaceChildren(); }
  }
  addEventListener("pointerdown", e => {
    if (!on || reduce.matches || (e.pointerType === "mouse" && e.button !== 0)) return;
    if (e.target.closest?.("input,textarea,select")) return;
    burst(e.clientX, e.clientY);
    stopHold(); pos = { x: e.clientX, y: e.clientY, id: e.pointerId };
    const started = Date.now();
    holdT = setInterval(() => { if (pos && Date.now() - started > 220) rise(pos.x, pos.y); }, CFG.fx.holdEveryMs);
  }, { passive: true });
  addEventListener("pointermove", e => { if (pos && e.pointerId === pos.id) { pos.x = e.clientX; pos.y = e.clientY; } }, { passive: true });
  for (const ev of ["pointerup", "pointercancel", "blur"]) addEventListener(ev, stopHold, { passive: true });
  document.addEventListener("visibilitychange", () => { if (document.hidden) stopHold(); });
  // phones: a long press would open the link/image menu and end the stream, so skip that menu while fun mode is on
  let lastType = "mouse";
  addEventListener("pointerdown", e => { lastType = e.pointerType; }, { capture: true, passive: true });
  addEventListener("contextmenu", e => { if (on && lastType === "touch" && !e.target.closest?.("input,textarea")) e.preventDefault(); });
  $("#fx-toggle").addEventListener("click", () => setOn(!on));
  setOn(on);
})();

/* router */
function route() {
  const h = location.hash || "#/";
  const m = h.match(/^#\/t\/([^/]+)\/(.+)$/);
  if (m) { openDetail(decodeURIComponent(m[1]), decodeURIComponent(m[2])); return; }
  openList(h === "#/trending" ? "trending" : h === "#/new" || h === "#/baru" ? "fresh" : h === "#/watchlist" ? "watch" : "all");
}
window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => { if (!document.hidden) liveTick(); });

route();
loadFeeds();
setInterval(liveTick, CFG.liveMs);
setInterval(() => loadFeeds(), CFG.feedMs);
setInterval(paintLive, 1000);
})();
</script>
</body>
