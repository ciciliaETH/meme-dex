<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MemeDex">
  <defs>
    <linearGradient id="md-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7cc0"/>
      <stop offset=".55" stop-color="#ff2e8a"/>
      <stop offset="1" stop-color="#a3125f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#md-bg)"/>
